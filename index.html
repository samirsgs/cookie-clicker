<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="falling-cookies"></div>
  <div id="game-container">

    <!-- LEFT: cookie + stats -->
    <div id="left-panel">
      <div id="bakery-name">Your Bakery Name</div>
      <h1 id="score">0 cookies</h1>
      <p id="cps">per second: 0</p>
      <img id="cookie" src="image.png" alt="Cookie">
    </div>

    <!-- MIDDLE: buildings/upgrades feed -->
    <div id="middle-panel">
      <div id="news-bar">Welcome to your bakery!</div>
      <div id="buildings-feed">
        <!-- later: rows showing owned buildings, like the real game -->
      </div>
    </div>

    <!-- RIGHT: store -->
    <div id="shop">
      <h2>Store</h2>
      <div class="shop-item" id="buy-autoclicker" disabled>
        <div class="item-icon"></div>
        <div class="item-info">
          <span class="item-name">Autoclicker</span>
          <span class="item-cost">100</span>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
