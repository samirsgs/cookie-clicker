<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="falling-cookies"></div>
    <div id="game-container">

        <!-- LEFT: cookie + stats -->
        <div id="left-panel">
            <div id="bakery-name">Your Bakery Name</div>
            <h1 id="score">0 cookies</h1>
            <p id="cps">per second: 0</p>
            <img id="cookie" src="image.png" alt="Cookie">
            <div id="golden-cookie" style="display: none;">✨🍪</div>
            <div id="falling-cookies"></div>
            <div id="achievement-toast"></div>
            
        </div>

        <!-- MIDDLE: buildings/upgrades feed -->
        <div id="middle-panel">
            <div id="top-nav">
                <button class="nav-btn">Options</button>
                <button class="nav-btn">Stats</button>
                <div id="news-bar">Welcome to your bakery!</div>
                <button class="nav-btn">Info</button>
                <button class="nav-btn">Legacy</button>
                <button id="save-btn" class="nav-btn">💾 Save</button>
            </div>
            <div id="buildings-feed">
                <div id="pacman-row" class="building-row" style="display: none;">
                    <div id="pacman">😋</div>
                    <div id="pacman-track"></div>
                </div>
            </div>
        </div>

        <!-- RIGHT: store -->
        <div id="shop">
            <h2>Store</h2>

            <div id="category-icons">
                <div class="category-icon">💩</div>
                <div class="category-icon">💩</div>
                <div class="category-icon">💩</div>
                <div class="category-icon">💩</div>
                <div class="category-icon">💩</div>
            </div>

            <div id="buy-selector">
                <button id="mode-buy" class="mode-btn active">Buy</button>
                <button id="mode-sell" class="mode-btn">Sell</button>
                <button class="buy-qty active" data-qty="1">1</button>
                <button class="buy-qty" data-qty="10">10</button>
                <button class="buy-qty" data-qty="100">100</button>
            </div>

            <div class="shop-item" id="buy-autoclicker" disabled>
                <div class="item-icon">🖱️</div>
                <div class="item-info">
                    <span class="item-name">Autoclicker</span>
                    <span class="item-cost">1</span>
                </div>
            </div>

            <div class="shop-item" id="buy-pacman" disabled>
                <div class="item-icon">👻</div>
                <div class="item-info">
                    <span class="item-name">Pac-Man</span>
                    <span class="item-cost">200</span>
                </div>
            </div>

            <div class="shop-item" id="buy-oven" disabled>
                <div class="item-icon">♨️</div>
                <div class="item-info">
                    <span class="item-name">Oven</span>
                    <span class="item-cost">1000</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
